a, sans-serif" font-size="16" font-weight="700">// made in Ukraine</text></g><rect x="525" y="57" width="72" height="72" rx="20" fill="#FFFFFF" transform="rotate(-12 561 93)"/><svg width="52" height="52" x="535" y="67" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Miria">
